services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-authdb}
      PGDATA: /var/lib/postgresql/18/main
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/main
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-auth} -d ${POSTGRES_DB:-authdb}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: dev
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
      # Admin plane: bound to 0.0.0.0 *inside* the container (see
      # ADMIN_BIND_ADDR below) but published only to the host's loopback, so the
      # boundary the design relies on is preserved rather than abandoned.
      # Nothing listens here unless ADMIN_API_ENABLED=true.
      - "127.0.0.1:${ADMIN_PORT:-8081}:${ADMIN_PORT:-8081}"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-authdb}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      INSECURE_COOKIES: ${INSECURE_COOKIES:-true}
      SERVER_PORT: ${SERVER_PORT:-8080}
      ADMIN_API_ENABLED: ${ADMIN_API_ENABLED:-false}
      ADMIN_PORT: ${ADMIN_PORT:-8081}
      # A container's loopback is its own, so the default 127.0.0.1 would make
      # the admin plane unreachable even from the host. Binding container-wide
      # and publishing to host loopback (above) is the equivalent boundary.
      ADMIN_BIND_ADDR: ${ADMIN_BIND_ADDR:-0.0.0.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
